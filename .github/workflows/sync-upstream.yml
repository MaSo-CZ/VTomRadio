name: Sync Upstream (Hourly)

on:
  schedule:
    - cron: '0 * * * *' # Každou hodinu
  workflow_dispatch:     # Ruční tlačítko

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync from Upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/VaraiTamas/VTomRadio.git
          git fetch upstream
          git checkout main
          git merge upstream/main --ff-only || git merge upstream/main -m "Auto-sync from upstream"
          git push origin main
