name: Sync Upstream (Hourly)

on:
  schedule:
    - cron: '0 * * * *' # Běží každou hodinu
  workflow_dispatch:     # Ruční spuštění z webu

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync from Upstream and Notify
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/VaraiTamas/VTomRadio.git
          git fetch upstream

          # Uložení stavu před merge
          BEFORE_HASH=$(git rev-parse HEAD)

          git checkout main
          git merge upstream/main --ff-only || git merge upstream/main -m "Auto-sync from upstream"

          # Uložení stavu po merge
          AFTER_HASH=$(git rev-parse HEAD)

          # Odeslání zprávy jen v případě, že přibyly nové commits
          if [ "$BEFORE_HASH" != "$AFTER_HASH" ]; then
            git push origin main
            
            if [ -n "$DISCORD_WEBHOOK" ]; then
              curl -H "Content-Type: application/json" \
                   -X POST \
                   -d '{"content": "🔄 **VTomRadio Sync:** Proběhla úspěšná aktualizace/synchronizace z upstreamu."}' \
                   $DISCORD_WEBHOOK
            fi
          else
            echo "Žádné nové změny, zpráva se neposílá."
          fi
